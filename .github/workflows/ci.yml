name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate workflows and scan for secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_repo.py

  middleware:
    name: Middleware tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: middleware/requirements-dev.txt
      - run: pip install -r middleware/requirements-dev.txt
      - run: pytest -q
        working-directory: middleware

  compose:
    name: Docker Compose config + database schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose.yml
        run: |
          docker compose --env-file .env.example config -q
          docker compose --env-file .env.example --profile tools --profile tunnel config -q
      - name: Apply database/schema.sql (twice, must be idempotent)
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/schema.sql
          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f database/schema.sql
      - name: Build the middleware image
        run: docker build -t middleware-ci middleware
